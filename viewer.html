<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 阅读器</title>
<style>
  :root{--ink:#1a2332;--mute:#5a6577;--blue:#1a5276;--line:#d5dae2;--bar:#2b3444;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#525659;color:var(--ink);}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
       background:var(--bar);color:#fff;padding:8px 14px;box-shadow:0 1px 4px rgba(0,0,0,.3);}
  .bar .fname{font-size:14px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw;}
  .bar .sp{flex:1}
  .bar button,.bar a{background:#3b465a;color:#fff;border:1px solid #56617a;border-radius:6px;
       padding:4px 10px;font-size:13px;cursor:pointer;text-decoration:none;}
  .bar button:hover,.bar a:hover{background:#48546c}
  .bar .pg{font-size:13px;min-width:88px;text-align:center;}
  .bar input{width:44px;background:#1e2530;border:1px solid #56617a;color:#fff;border-radius:5px;text-align:center;padding:2px;}
  #stage{padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:100vh;}
  canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45);max-width:100%;}
  #err{max-width:760px;margin:60px auto;background:#fff3f3;color:#a33;border:1px solid #e6b8b8;
       border-radius:10px;padding:22px 26px;line-height:1.7;display:none;}
  #loading{color:#dde;text-align:center;padding:60px;font-size:15px;}
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">← 目录</a>
  <span class="fname" id="fname">PDF</span>
  <span class="sp"></span>
  <button onclick="zoom(-0.1)">－</button>
  <span class="pg" id="zoomLabel">100%</span>
  <button onclick="zoom(0.1)">＋</button>
  <span class="sp"></span>
  <button onclick="go(-1)">‹ 上一页</button>
  <span class="pg">第 <input id="pg" value="1" onchange="goTo()"> / <span id="total">?</span> 页</span>
  <button onclick="go(1)">下一页 ›</button>
  <a id="dl" href="#" download>⬇ 下载</a>
</div>
<div id="loading">正在加载 PDF…（若长时间无反应，多为网络拦截了 CDN）</div>
<div id="err"></div>
<div id="stage" style="display:none"><canvas id="cv"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function(){
  var file = new URLSearchParams(location.search).get('file');
  var errBox=document.getElementById('err');
  function fail(msg){
    document.getElementById('loading').style.display='none';
    errBox.style.display='block';
    errBox.innerHTML='<b>⚠ 无法用在线阅读器打开</b><br>'+msg+
      '<br><br>改用：<br>· <a href="index.html" style="color:#1a5276">返回目录用「在线阅读 / 下载」</a>'+
      (file?'<br>· <a href="'+encodeURI(file)+'" download style="color:#1a5276">直接下载该 PDF</a>':'');
  }
  if(!file){ fail('地址缺少 <code>?file=文件名.pdf</code> 参数。'); return; }
  document.getElementById('fname').textContent = decodeURIComponent(file);
  document.getElementById('dl').href = encodeURI(file);

  var lib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
  if(!lib){ fail('PDF.js 加载失败（CDN 可能被网络拦截）。'); return; }
  lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var pdf=null, pageNum=1, scale=1.3, cv=document.getElementById('cv'), ctx=cv.getContext('2d');

  function render(){
    pdf.getPage(pageNum).then(function(page){
      var vp=page.getViewport({scale:scale});
      var dpr=window.devicePixelRatio||1;
      cv.width=vp.width*dpr; cv.height=vp.height*dpr;
      cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      page.render({canvasContext:ctx,viewport:vp});
      document.getElementById('pg').value=pageNum;
      document.getElementById('total').textContent=pdf.numPages;
      document.getElementById('zoomLabel').textContent=Math.round(scale/1.3*100)+'%';
    });
  }
  window.go=function(d){ if(!pdf)return; pageNum=Math.min(Math.max(1,pageNum+d),pdf.numPages); render(); };
  window.goTo=function(){ var v=parseInt(document.getElementById('pg').value,10); if(!isNaN(v)&&pdf){ pageNum=Math.min(Math.max(1,v),pdf.numPages); render(); } };
  window.zoom=function(d){ scale=Math.min(Math.max(0.4,scale+d),3); render(); };

  lib.getDocument(encodeURI(file)).promise.then(function(p){
    pdf=p; document.getElementById('loading').style.display='none';
    document.getElementById('stage').style.display='flex'; render();
  }).catch(function(e){ fail('读取 PDF 失败：'+(e&&e.message?e.message:e)); });
})();
</script>
</body>
</html>
